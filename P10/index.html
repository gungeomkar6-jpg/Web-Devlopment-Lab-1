<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P10 - Flexbox Header and Footer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>My Portfolio</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Welcome to My Portfolio</h2>
            <p>This is my P10 Flexbox practical.</p>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>Hello! I am an engineering student.</p>
        </section>

        <section id="projects">
            <h2>My Projects</h2>
            <p>Learning HTML, CSS and JavaScript.</p>
        </section>
    </main>

    <footer class="footer">
        <p>Copyright 2026 My Portfolio</p>
        <div>
            <a href="#home">Home</a>
            <a href="#contact">Contact</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
