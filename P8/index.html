<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P8 - Sticky Navbar and Card Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Portfolio</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="home">
            <h2>Welcome to My Portfolio</h2>
            <p>This is my P8 practical.</p>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>Hello! I am an engineering student.</p>
        </section>

        <section id="projects">
            <h2>My Projects</h2>

            <div class="card">
                <img src="https://placehold.co/600x300/2563eb/ffffff?text=Project+1" alt="Project 1">
                <div class="overlay">
                    <h3>Project One</h3>
                    <p>My first web project.</p>
                </div>
            </div>

            <div class="card">
                <img src="https://placehold.co/600x300/1e3a8a/ffffff?text=Project+2" alt="Project 2">
                <div class="overlay">
                    <h3>Project Two</h3>
                    <p>My second web project.</p>
                </div>
            </div>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <p>Email: omkar@example.com</p>
        </section>
    </main>

    <footer>
        <p>Copyright 2026 My Portfolio</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
